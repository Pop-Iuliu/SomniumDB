version: '3'
services:
  prometheus:
    image: prom/prometheus
    ports:
      - "127.0.0.1:9091:9090" # localhost only: Prometheus has no authentication
    # scrapes the host's exporter: run SomniumDB with SOMNIUM_METRICS_BIND set to the
    # Docker bridge address (see README)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana
    ports:
      - "127.0.0.1:3000:3000" # localhost only: Grafana starts with admin/admin
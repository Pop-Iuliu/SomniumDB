version: '3'
services:
  prometheus:
    image: prom/prometheus
    ports:
      - "9091:9090"
    # scrapes the host's exporter: run SomniumDB with SOMNIUM_METRICS_BIND=0.0.0.0 (see README)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"